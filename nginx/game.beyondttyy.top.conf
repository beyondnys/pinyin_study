# game.beyondttyy.top 生产示例（HTTPS）
# 后端 uvicorn 示例：--host 127.0.0.1 --port 8006 --workers 2
#
# 常见 404：proxy_pass 写成 http://127.0.0.1:8006/ 会去掉 /api 前缀，
# 后端收到 POST /auth/login，而 FastAPI 路由为 POST /api/auth/login。
# 请使用下面两种写法之一（二选一，不要混用）。

server {
    listen 80;
    server_name game.beyondttyy.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name game.beyondttyy.top;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/pinyin-game/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台静态资源（构建 base 为 /admin/）
    location /admin {
        alias /var/www/pinyin-game/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # 写法 A：保留完整路径 /api/... 转发到后端（推荐）
    location /api/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 写法 B（与写法 A 等价，勿同时启用）：
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8006/api/;
    #     ...
    # }

    # 错误示例（会导致 404）：
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8006/;   # 末尾 / 会剥掉 /api
    # }
}
